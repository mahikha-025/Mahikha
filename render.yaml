services:
  - type: web
    name: predictive-maintenance
    runtime: python
    rootDir: predictive-maintenance
    buildCommand: pip install -r requirements.txt && python ml/train_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: predictive_maintenance
      - key: REQUIRE_MONGODB
        value: "true"